# Sniper 6.0 baseline corresponding to Table 1 of
# "Decoupled Vector Runahead" (MICRO 2023).
#
# The paper's private Sniper extensions (TAGE-SC-L, Ice Lake execution
# ports/vector units and DVR) are not part of public Sniper 6.0. Values below
# configure every Table 1 item directly supported by stock Sniper 6.0.

#include gainestown
#include rob

[general]
total_cores = 1

[perf_model/core]
frequency = 4.0
type = rob
logical_cpus = 1
core_model = nehalem

[perf_model/core/interval_timer]
dispatch_width = 5
window_size = 350

[perf_model/core/rob_timer]
in_order = false
issue_contention = true
issue_memops_at_issue = true
outstanding_loads = 128
outstanding_stores = 72
commit_width = 5
rs_entries = 128

# Stock Sniper 6.0 has one_bit and pentium_m only. The paper's 8 KB
# TAGE-SC-L requires the authors' private extension, so pentium_m is the
# closest functional stock baseline. Fifteen front-end stages are modeled
# here as a 15-cycle branch-misprediction penalty.
[perf_model/branch_predictor]
type = pentium_m
mispredict_penalty = 15

[perf_model/cache]
levels = 3

[perf_model/l1_icache]
cache_block_size = 64
cache_size = 32
associativity = 4
data_access_time = 2
tags_access_time = 0
perf_model_type = parallel
shared_cores = 1
prefetcher = none

[perf_model/l1_dcache]
cache_block_size = 64
cache_size = 32
associativity = 8
data_access_time = 4
tags_access_time = 0
perf_model_type = parallel
shared_cores = 1
outstanding_misses = 24
prefetcher = simple

[perf_model/l1_dcache/prefetcher]
prefetch_on_prefetch_hit = true

[perf_model/l1_dcache/prefetcher/simple]
flows = 16
flows_per_core = false
num_prefetches = 4
stop_at_page_boundary = true

[perf_model/l2_cache]
cache_block_size = 64
cache_size = 256
associativity = 8
data_access_time = 8
tags_access_time = 0
perf_model_type = parallel
shared_cores = 1
prefetcher = none

[perf_model/l3_cache]
cache_block_size = 64
cache_size = 8192
associativity = 16
data_access_time = 30
tags_access_time = 0
perf_model_type = parallel
shared_cores = 1
prefetcher = none

[perf_model/dram]
type = constant
latency = 50
num_controllers = 1
per_controller_bandwidth = 51.2
controllers_interleaving = 1
direct_access = false
